<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UNO Q 手寫數字辨識</title>
<style>
  body{font-family:system-ui,sans-serif;background:#111;color:#eee;margin:0;padding:16px;
       display:flex;flex-direction:column;align-items:center;gap:12px}
  h1{font-size:20px;margin:4px 0}
  #pad{width:min(80vw,320px);height:min(80vw,320px);background:#000;border:2px solid #444;
       border-radius:8px;touch-action:none}
  .row{display:flex;gap:16px;align-items:center}
  button{font-size:18px;padding:10px 22px;border-radius:8px;border:none;background:#2d6cdf;color:#fff}
  button.gray{background:#555}
  #result{font-size:56px;font-weight:bold;min-width:60px;text-align:center}
  #preview{width:84px;height:84px;image-rendering:pixelated;border:1px solid #444}
  #bars{width:min(80vw,320px)}
  .bar{display:flex;align-items:center;gap:6px;margin:2px 0;font-size:14px}
  .bar span{width:14px}
  .bar div{height:12px;background:#2d6cdf;border-radius:3px}
  #info{font-size:13px;color:#aaa;text-align:center}
</style>
</head>
<body>
<h1>UNO Q 手寫數字辨識</h1>
<canvas id="pad" width="280" height="280"></canvas>
<div class="row">
  <button class="gray" id="clear">清除</button>
  <button id="go">辨識</button>
</div>
<div class="row">
  <div style="text-align:center;font-size:12px;color:#aaa">
    <canvas id="preview" width="28" height="28"></canvas><br>模型看到的 28×28
  </div>
  <div id="result">?</div>
</div>
<div id="bars"></div>
<div id="info">在黑色區域寫一個 0–9 的數字</div>

<script>
const pad = document.getElementById('pad'), ctx = pad.getContext('2d');
const pv = document.getElementById('preview').getContext('2d');
ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = 22; ctx.strokeStyle = '#fff';

function drawBars(p) {
  const b = document.getElementById('bars'); b.innerHTML = '';
  for (let i = 0; i < 10; i++) {
    const v = p ? p[i] : 0;
    b.insertAdjacentHTML('beforeend',
      `<div class="bar"><span>${i}</span><div style="width:${Math.max(v * 80, 0.5)}%"></div><small>${(v * 100).toFixed(1)}%</small></div>`);
  }
}
function clearPad() {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 280, 280);
  pv.fillStyle = '#000'; pv.fillRect(0, 0, 28, 28);
  document.getElementById('result').textContent = '?';
  document.getElementById('info').textContent = '在黑色區域寫一個 0–9 的數字';
  drawBars(null);
  fetch('/clear', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' }).catch(() => {});
}

// ---- 畫圖 ----
let drawing = false, last = null, timer = null;
function pos(e) {
  const r = pad.getBoundingClientRect();
  return [(e.clientX - r.left) * 280 / r.width, (e.clientY - r.top) * 280 / r.height];
}
pad.addEventListener('pointerdown', e => {
  drawing = true; last = pos(e); pad.setPointerCapture(e.pointerId); clearTimeout(timer);
  ctx.beginPath(); ctx.arc(last[0], last[1], 11, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill();
});
pad.addEventListener('pointermove', e => {
  if (!drawing) return;
  const p = pos(e);
  ctx.beginPath(); ctx.moveTo(last[0], last[1]); ctx.lineTo(p[0], p[1]); ctx.stroke(); last = p;
});
pad.addEventListener('pointerup', () => { drawing = false; timer = setTimeout(predict, 400); });

// ---- 轉成 MNIST 格式：裁切 → 縮到 20x20 → 置中放進 28x28 ----
function toMnist() {
  const src = ctx.getImageData(0, 0, 280, 280).data;
  let minX = 280, minY = 280, maxX = -1, maxY = -1;
  for (let y = 0; y < 280; y++) for (let x = 0; x < 280; x++) {
    if (src[(y * 280 + x) * 4] > 20) {
      if (x < minX) minX = x; if (x > maxX) maxX = x;
      if (y < minY) minY = y; if (y > maxY) maxY = y;
    }
  }
  if (maxX < 0) return null;
  const bw = maxX - minX + 1, bh = maxY - minY + 1, s = 20 / Math.max(bw, bh);
  const small = document.createElement('canvas'); small.width = 28; small.height = 28;
  const sc = small.getContext('2d');
  sc.fillStyle = '#000'; sc.fillRect(0, 0, 28, 28);
  sc.imageSmoothingEnabled = true; sc.imageSmoothingQuality = 'high';
  sc.drawImage(pad, minX, minY, bw, bh, (28 - bw * s) / 2, (28 - bh * s) / 2, bw * s, bh * s);
  const d = sc.getImageData(0, 0, 28, 28).data, px = [];
  for (let i = 0; i < 784; i++) px.push(d[i * 4] / 255);
  return { px, small };
}

async function predict() {
  const r = toMnist(); if (!r) return;
  pv.drawImage(r.small, 0, 0);
  const t0 = performance.now();
  try {
    const res = await fetch('/predict', { method: 'POST',
      headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pixels: r.px }) });
    const j = await res.json();
    document.getElementById('result').textContent = j.digit;
    drawBars(j.probs);
    document.getElementById('info').textContent =
      `板子推論 ${j.ms.toFixed(2)} ms ・ 來回 ${(performance.now() - t0).toFixed(0)} ms ・ 信心 ${(j.probs[j.digit] * 100).toFixed(1)}%`;
  } catch (err) {
    document.getElementById('info').textContent = '連線失敗：' + err;
  }
}

document.getElementById('clear').onclick = clearPad;
document.getElementById('go').onclick = predict;
clearPad();
</script>
</body>
</html>
